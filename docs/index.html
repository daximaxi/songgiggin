<!DOCTYPE html>
<html lang="en">

<meta name="theme-color" content="#171b22" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap">
<style>
:root {
  /* Layout: slim top bar, one working column (max 1040px). The stage view is a
     full-bleed overlay with thumb-sized transport buttons along the bottom edge.
     One loud element: setlists set in condensed poster type with big numerals. */
  --bg: #f1f2f4;
  --surface: #ffffff;
  --ink: #14171c;
  --muted: #59616e;
  --line: #d5d9df;
  --accent: #ad4e08;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --ok: #1c7c45;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Haettenschweiler", Impact, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Consolas, "Roboto Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="light"]) { --bg: #0f1216; --surface: #171b22; --ink: #eceef2; --muted: #98a2b0; --line: #2b323d; --accent: #f4ae3d; --accent-ink: #1b1203; --danger: #ff8478; --ok: #62d391; color-scheme: dark; }
}
:root[data-theme="dark"]:not([data-mode="light"]) { --bg: #0f1216; --surface: #171b22; --ink: #eceef2; --muted: #98a2b0; --line: #2b323d; --accent: #f4ae3d; --accent-ink: #1b1203; --danger: #ff8478; --ok: #62d391; color-scheme: dark; }
:root[data-mode="dark"] { --bg: #0f1216; --surface: #171b22; --ink: #eceef2; --muted: #98a2b0; --line: #2b323d; --accent: #f4ae3d; --accent-ink: #1b1203; --danger: #ff8478; --ok: #62d391; color-scheme: dark; }
/* Black: pure black for OLED screens and dark rooms. Text a little dimmer so it does not glare. */
/* The extra :not() parts make this win over the dark rules above, also when the phone is in dark mode
   or the host page sets data-theme="dark". */
:root[data-mode="black"]:not([data-mode="x"]):not([data-theme="x"]) { --bg: #0f1216; --surface: #171b22; --ink: #eceef2; --muted: #98a2b0; --line: #2b323d; --accent: #f4ae3d; --accent-ink: #1b1203; --danger: #ff8478; --ok: #62d391; color-scheme: dark; --bg: #000000; --surface: #000000; --ink: #d4d8de; --muted: #8a919c; --line: #2a2e35; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.ico { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.top {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
}
/* Wordmark C, "Merkispjald": the dark word on a banner in the accent colour, like a label on an amp. */
.brand {
  font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: .04em;
  text-transform: uppercase; line-height: 1; padding: 6px 11px 4px; border-radius: 4px;
  background: var(--accent); color: var(--accent-ink); text-decoration: none;
}
.tabs { display: flex; gap: 4px; }
.tabs a {
  font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .03em;
  text-transform: uppercase; text-decoration: none; color: var(--muted);
  padding: 6px 12px; border-bottom: 3px solid transparent;
}
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.top .spacer { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-s="synced"] i { background: var(--ok); }
.sync[data-s="syncing"] i { background: var(--accent); }
.sync[data-s="local"] i, .sync[data-s="offline"] i { background: transparent; border: 2px solid var(--muted); }

/* ---------- shared controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted);
}
.iconbtn:hover { color: var(--ink); border-color: var(--line); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.iconbtn.txt { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; color: var(--ink); border-color: var(--line); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); }
.input {
  min-height: 44px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); width: 100%; min-width: 0;
}
.input.bad { border-color: var(--danger); }
.hint { font-size: 13px; color: var(--muted); }
.hint.bad { color: var(--danger); }
.chip {
  display: inline-flex; align-items: center; justify-content: center; min-width: 2.4em; padding: 2px 8px;
  border: 1px solid var(--line); border-radius: 4px; font-family: var(--font-mono); font-size: 14px; font-weight: 700;
}
.tag { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 0 6px; }

/* ---------- main column ---------- */
#main { flex: 1; overflow: auto; }
.col { max-width: 1040px; margin: 0 auto; padding: 20px 16px 64px; display: flex; flex-direction: column; gap: 16px; }
.pagehead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.pagehead h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: .95; letter-spacing: .01em;
  text-transform: uppercase; margin: 0; text-wrap: balance;
}
.pagehead .count { color: var(--muted); font-variant-numeric: tabular-nums; padding-bottom: 4px; }
.pagehead .spacer { flex: 1; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .input { padding-left: 40px; }
.empty { padding: 32px 16px; text-align: left; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }

/* song pool rows */
.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
.row { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .open {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left;
  background: transparent; border: 0; padding: 10px 12px 10px 16px; min-height: 60px;
}
.row .open:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.row .t { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.row .t b { font-size: 17px; overflow-wrap: anywhere; }
.row .t small { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.row .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.row .acts { display: flex; padding-right: 6px; }

/* ---------- setlists: the poster treatment ---------- */
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.listcard {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 120px;
}
.listcard:hover { border-color: var(--accent); }
.listcard b { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.listcard small { color: var(--muted); font-variant-numeric: tabular-nums; }
.sethead { display: flex; flex-direction: column; gap: 12px; }
.sethead .name {
  font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase;
  border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 4px 0; width: 100%; border-radius: 0;
}
.sethead .name:focus { border-bottom-color: var(--accent); outline: 0; }
.sethead .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sethead .bar .spacer { flex: 1; }
.setsongs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.setsongs li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 6px 0; flex-wrap: wrap; }
.setsongs .num {
  font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: .9; width: 1.25em; text-align: right;
  color: var(--accent); font-variant-numeric: tabular-nums; flex: none;
}
.setsongs .open { flex: 1 1 200px; min-width: 0; text-align: left; background: transparent; border: 0; padding: 6px 8px; display: flex; flex-direction: column; }
.setsongs .open b { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.02; text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
.setsongs .open small { color: var(--muted); }
.setsongs .open:hover b { color: var(--accent); }
.keybox { display: flex; align-items: center; gap: 4px; }
.keys { display: flex; align-items: stretch; gap: 10px; }
.keys .k { display: flex; flex-direction: column; align-items: center; line-height: 1.1; min-width: 3em; }
.keys .k small { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.keys .k b { font-family: var(--font-mono); font-size: 20px; }
.keys .k.cur b { color: var(--accent); }
.setsongs .acts { display: flex; }

/* ---------- editor ---------- */
.edhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.edhead .spacer { flex: 1; }
.fields { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; gap: 12px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tools .btn { min-height: 40px; padding: 6px 12px; font-weight: 400; font-size: 14px; }
.tools .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.split textarea {
  width: 100%; min-height: 60vh; resize: vertical; padding: 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); font-family: var(--font-mono); font-size: 15px; line-height: 1.5; tab-size: 8; white-space: pre; overflow: auto;
}
.preview { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 14px; min-height: 60vh; overflow-x: auto; font-size: 17px; }
.preview h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 400; }
.help { font-size: 14px; color: var(--muted); }
.help code { font-family: var(--font-mono); background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 1px 5px; border-radius: 3px; color: var(--ink); }

/* ---------- the song sheet (shared by preview and stage) ---------- */
.sheet-body { display: flex; flex-direction: column; }
.ln { display: flex; flex-wrap: wrap; align-items: flex-end; }
.ln.gap { height: 1.1em; }
.grp { display: inline-flex; align-items: flex-end; }
.u { display: inline-flex; flex-direction: column; align-items: flex-start; }
.ch { color: var(--accent); font-weight: 700; font-size: .95em; line-height: 1.25; padding-right: .45em; white-space: pre; min-height: 1.25em; }
.ch.an { font-weight: 400; font-style: italic; color: var(--muted); }
.ly { white-space: pre; line-height: 1.3; min-height: 1.3em; }
.ln.only-ch .ly { display: none; }
.ln.only-ch .ch { padding-right: .9em; }
.sec { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-size: .9em; margin-top: .5em; }
.cmt { font-style: italic; color: var(--muted); font-size: .9em; }
.chorus { border-left: 4px solid var(--accent); padding-left: .7em; margin: .2em 0; display: flex; flex-direction: column; }
pre.tab { font-family: var(--font-mono); font-size: .8em; line-height: 1.25; margin: .4em 0; overflow-x: auto; white-space: pre; }
.tabnote { font-size: .75em; color: var(--muted); font-style: italic; }

/* ---------- stage ---------- */
#stage { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
.sttop { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sttitle { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; line-height: 1.05; }
.sttitle b { font-family: var(--font-display); font-weight: 800; font-size: 28px; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sttitle small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stctl { display: flex; align-items: center; gap: 2px; }
.stctl .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 0 4px; }
.stctl .iconbtn { font-weight: 700; font-size: 17px; }
.stsheet { flex: 1; overflow: auto; padding: 18px 20px 55vh; overscroll-behavior: contain; }
.stend { margin-top: 2.5em; color: var(--muted); font-size: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.transport { display: grid; grid-template-columns: 1fr 76px minmax(120px, 1.2fr) 76px 1fr; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface); }
.transport button { min-height: 68px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); min-width: 0; }
.transport .step { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; }
.transport .step:active, .transport .nav:active { background: var(--line); }
.transport .play { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 10px; }
.transport .play svg { width: 30px; height: 30px; }
.transport .play .sp { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.transport .play .sp small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.transport .play .sp b { font-family: var(--font-display); font-weight: 800; font-size: 34px; font-variant-numeric: tabular-nums; }
.transport .nav { display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--ink); overflow: hidden; }
.transport .nav.next { justify-content: flex-end; text-align: right; }
.transport .nav span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; color: var(--muted); }
.transport .nav:disabled { opacity: .3; cursor: default; }

/* ---------- dialogs and toast ---------- */
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0; width: min(520px, calc(100% - 32px)); max-height: calc(100% - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
.dlg { display: flex; flex-direction: column; gap: 14px; padding: 18px; max-height: calc(100vh - 34px); }
.dlg h2 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 28px; line-height: 1; margin: 0; }
.dlg .list { overflow: auto; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; min-height: 60px; }
.dlg .list .item { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-bottom: 1px solid var(--line); }
.dlg .list .item:last-child { border-bottom: 0; }
.dlg .list .item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dlg .list .item .t small { color: var(--muted); }
.dlg .foot { display: flex; justify-content: flex-end; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; min-height: 44px; padding: 6px 14px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper b { font-family: var(--font-mono); min-width: 2.5em; text-align: center; font-size: 18px; }
#toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40;
  background: var(--ink); color: var(--bg); border-radius: 6px; padding: 10px 14px;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); font-size: 15px;
}
#toast button { background: transparent; border: 0; color: inherit; font-weight: 700; text-decoration: underline; padding: 4px; }

@media (max-width: 760px) {
  .fields { grid-template-columns: 1fr 1fr; }
  .split { grid-template-columns: 1fr; }
  .split textarea, .preview { min-height: 38vh; }
  .pagehead h1, .sethead .name { font-size: 36px; }
  .setsongs .num { font-size: 42px; }
  .setsongs .open b { font-size: 25px; }
  .row .meta .bpm, .row .meta .tag { display: none; }
  .row .open { padding-left: 12px; gap: 8px; }
  .row .acts .iconbtn { width: 38px; }
  .sync span { display: none; }
  .transport { grid-template-columns: 1fr 64px minmax(104px, 1.2fr) 64px 1fr; gap: 6px; }
  .transport .nav span { display: none; }
  .transport .nav, .transport .nav.next { justify-content: center; }
  .sttitle b { font-size: 22px; }
  .stsheet { padding: 14px 14px 55vh; }
}

/* ---------- v1.1: tags, sorting, colour, import ---------- */
.btn.small { min-height: 36px; padding: 4px 10px; font-size: 14px; }
.poolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.poolbar .search { max-width: none; flex: 1 1 260px; }
.sortbox { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.select { width: auto; padding-right: 32px; cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%; background-size: 5px 5px; background-repeat: no-repeat; color: var(--ink); }
.tagfilter, .tagrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tagrow .lbl { font-size: 13px; color: var(--muted); margin-right: 4px; }
.tagchip {
  min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 14px;
}
.tagchip:hover { border-color: var(--accent); }
.tagchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.newtag { display: inline-flex; align-items: center; gap: 4px; }
.taginput { width: 150px; min-height: 36px; padding: 4px 10px; font-size: 14px; }
.groups { display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.grouphead {
  display: flex; align-items: baseline; gap: 8px; margin: 0;
  font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; color: var(--accent);
}
.grouphead small { font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.listcard .gigdate { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.listcard .dates { font-size: 12px; }
.dlg { overflow: auto; }
dialog:has(.dlg.wide) { width: min(760px, calc(100% - 32px)); }
.importta { min-height: 42vh; resize: vertical; font-family: var(--font-mono); font-size: 14px; line-height: 1.45; white-space: pre; overflow: auto; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.swatch[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.swatch.custom { width: auto; border-radius: 22px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; cursor: pointer; font-size: 14px; background: var(--surface); }
.swatch.custom[data-on="true"] { outline: 3px solid var(--ink); outline-offset: 2px; }
.swatch.custom input { width: 34px; height: 34px; border: 0; padding: 0; background: transparent; cursor: pointer; }
.taglist { max-height: 280px; }
.taglist .item { padding: 4px 4px 4px 6px; }
.taglist .item .input { min-height: 38px; flex: 1; }
@media (max-width: 760px) {
  .pagehead .btn { padding: 8px 12px; }
  .grouphead { font-size: 22px; }
  .taginput { width: 120px; }
}
.field > .seg, .field > .stepper { align-self: flex-start; }
.dlg .newtag { display: flex; }
.dlg .newtag .input { flex: 1; }
.dlg .newtag .btn { white-space: nowrap; }
.cmt { margin-bottom: .7em; }
.cmt + .cmt { margin-top: -.5em; }
a.brand { text-decoration: none; }
a.brand:hover { filter: brightness(1.08); }
.hint.warn { color: var(--accent); font-weight: 700; }
.filename { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 14px; margin: 0; overflow-wrap: anywhere; }
.filerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.filerow .hint { flex: 1 1 220px; }
.summary .item { padding: 10px 12px; }
.summary .num { font-family: var(--font-mono); font-size: 18px; color: var(--accent); }
.summary .tagnames { color: var(--muted); text-align: right; }
.dlg .foot { flex-wrap: wrap; }
.dlg .foot .btn { white-space: nowrap; }

/* ---------- v3: notes on top of a song ---------- */
.sheet-body { position: relative; }
.notes-layer { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.notes-layer.drawing { pointer-events: auto; touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; }
.notes-layer.drawing.erase { cursor: cell; }
.notes-svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.notes-layer.erase .notes-svg .hit { pointer-events: stroke; }
.notes-layer.erase .note-text { pointer-events: auto; outline: 1px dashed var(--muted); }
.note-text {
  position: absolute; font-size: .72em; font-weight: 700; line-height: 1.2; white-space: pre-wrap; max-width: 18em;
  padding: 1px 4px; border-radius: 3px; background: color-mix(in srgb, var(--bg) 70%, transparent); pointer-events: none;
}
.note-input {
  position: absolute; z-index: 3; font-size: .72em; font-weight: 700; min-width: 14em; padding: 4px 6px;
  border: 2px solid var(--accent); border-radius: 4px; background: var(--surface); pointer-events: auto;
}
.notesbar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 10px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.notesbar .tool[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.notesbar .ngroup { display: inline-flex; align-items: center; gap: 4px; }
.nswatches { display: inline-flex; gap: 4px; padding: 0 4px; }
.nswatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.nswatch[aria-pressed="true"] { outline: 3px solid var(--ink); outline-offset: 1px; }
.nsep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.nhint { flex: 1 1 160px; text-align: right; }
.notesbtn { margin-right: 4px; }
@media (max-width: 760px) {
  .nhint { display: none; }
}
@media (max-width: 760px) {
  .notesbar { flex-wrap: nowrap; overflow-x: auto; gap: 2px; padding: 4px 6px; scrollbar-width: none; }
  .notesbar > * { flex: none; }
  .notesbar .btn.primary { margin-left: auto; position: sticky; right: 0; }
}
.note-text { width: max-content; max-width: min(18em, 92vw); }
/* pinch on the song changes the text size, not the page zoom */
.stsheet { touch-action: pan-x pan-y; }

/* ---------- v3.2 ---------- */
.datebox { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.datebox .input { color: var(--ink); }
.nsizes { display: inline-flex; gap: 2px; padding: 0 4px; border-left: 1px solid var(--line); margin-left: 2px; }
.nsize { width: 34px; height: 34px; border-radius: 6px; border: 1px solid transparent; background: transparent; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.nsize i { display: block; border-radius: 50%; background: var(--ink); }
.nsize[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); }
.sttop .stedit { margin-left: -6px; }

/* ---------- v3.3: chord diagrams, capo, lyrics only, print ---------- */
.stsheet, .preview { position: relative; }
.ch[data-c] { cursor: pointer; }
.cd { margin: 0; display: inline-flex; flex-direction: column; align-items: center; width: 4.2em; color: var(--ink); }
.cd figcaption { font-weight: 700; font-size: .85em; color: var(--accent); display: flex; gap: 2px; align-items: baseline; white-space: nowrap; }
.cd figcaption small { color: var(--muted); font-weight: 400; }
.cd-svg { width: 100%; height: auto; display: block; }
.cd-ln { stroke: currentColor; stroke-width: 1; opacity: .55; }
.cd-nut { stroke: currentColor; stroke-width: 3; }
.cd-dot { fill: currentColor; }
.cd-open { fill: none; stroke: currentColor; stroke-width: 1.2; }
.cd-x { stroke: currentColor; stroke-width: 1.2; fill: none; }
.cd-fr { fill: currentColor; font-size: 9px; font-family: var(--font-body); }
.cd-none { height: 4.6em; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.4em; }
.cd-strip { display: flex; flex-wrap: wrap; gap: .4em .9em; padding: 0 0 .8em; margin-bottom: .6em; border-bottom: 1px solid var(--line); font-size: .85em; }
.cd-pop {
  position: absolute; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .25); padding: 8px 10px 6px; display: flex; flex-direction: column; align-items: center; font-size: 22px; max-width: 220px;
}
.cd-pop .cd { width: 5em; }
.cd-pop .hint { font-size: 12px; text-align: center; }
.capobtn { min-height: 36px; padding: 2px 10px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.capobtn.on { color: var(--accent); border-color: var(--accent); }
.chordsbtn { min-height: 36px; padding: 2px 10px; }
.chordsbtn[aria-pressed="false"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.iconbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.capogrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.capoopt { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 2px; min-height: 64px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.capoopt b { font-family: var(--font-display); font-size: 26px; line-height: 1; }
.capoopt small { font-size: 11px; color: var(--muted); }
.capoopt .sk { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
.capoopt.easy { border-color: var(--accent); border-style: dashed; }
.capoopt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); border-style: solid; }
.capoopt[aria-pressed="true"] small { color: inherit; }
.easydot { display: inline-block; width: 14px; height: 10px; border: 1px dashed var(--accent); border-radius: 3px; vertical-align: middle; }
.setsongs .capobtn { margin-left: 2px; }
.printopts { display: flex; flex-direction: column; gap: 12px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
@media (max-width: 760px) {
  .capogrid { grid-template-columns: repeat(5, 1fr); }
  .cd-strip { font-size: .75em; }
}

/* print */
#print { display: none; }
@media print {
  @page { margin: 14mm 14mm 16mm; }
  html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; }
  #app, #stage, #toast, dialog { display: none !important; }
  #print { display: block; color: #000; font-family: var(--font-body); }
  #print .p-song { break-inside: auto; margin-bottom: 1.6em; }
  #print .p-song.newpage + .p-song.newpage, #print .p-list + .p-song.newpage { break-before: page; }
  #print .p-title { font-family: var(--font-display); font-weight: 800; font-size: 2em; text-transform: uppercase; line-height: 1; margin: 0; }
  #print .p-sub { color: #444; font-size: .9em; margin: .2em 0 .8em; }
  #print .ch { color: #000; }
  #print .ch.an, #print .cmt, #print .sec, #print .tabnote { color: #444; }
  #print .chorus { border-left-color: #000; }
  #print .cd, #print .cd figcaption { color: #000; }
  #print .cd-strip { border-bottom-color: #999; }
  #print .ln { break-inside: avoid; }
  #print .p-list h1 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; margin: 0 0 .2em; line-height: 1; }
  #print .p-list ol { margin: .4em 0 0; padding-left: 0; list-style: none; }
  #print .p-list li { display: flex; align-items: baseline; gap: .5em; border-bottom: 1px solid #bbb; padding: .15em 0; break-inside: avoid; }
  #print .p-list li .n { font-family: var(--font-display); font-weight: 800; width: 1.6em; text-align: right; flex: none; }
  #print .p-list li .tt { flex: 1; font-weight: 700; }
  #print .p-list li .kk { font-family: var(--font-mono); white-space: nowrap; }
  #print .p-list.big { font-size: 26px; }
  #print .p-list.big h1 { font-size: 1.6em; }
}

/* ---------- v3.4: black theme, song text settings, note selection, straight highlighter ---------- */
:root { --chord: var(--accent); --sheet-font: var(--font-body); --lyric-w: 400; --chord-w: 700; }
.stsheet .sheet-body, .preview .sheet-body, .txtprev .sheet-body { font-family: var(--sheet-font); font-weight: var(--lyric-w); }
.stsheet .ch, .preview .ch, .txtprev .ch { color: var(--chord); font-weight: var(--chord-w); }
.stsheet .ch.an, .preview .ch.an, .txtprev .ch.an { color: var(--muted); font-weight: 400; }
/* Highlight: a soft marker behind the chord name, not behind the gap after it. */
:root.chord-hi .stsheet .ch:not(.an):not(:empty),
:root.chord-hi .preview .ch:not(.an):not(:empty),
:root.chord-hi .txtprev .ch:not(.an):not(:empty) {
  background-color: color-mix(in srgb, var(--chord) 24%, transparent); background-clip: content-box; border-radius: .2em;
}
.textset .sub { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.textset .sub small { color: var(--muted); }
.textset .checks { display: flex; flex-wrap: wrap; gap: 0 18px; }
.swatch.same { display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent-ink); font-size: 13px; }
.txtprev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-top: 8px; background: var(--bg); font-size: 20px; line-height: 1.35; overflow-x: auto; }
.txtprev .sheet-body > *:first-child { margin-top: 0; }
.notes-layer.drawing.text .note-text { pointer-events: auto; cursor: grab; outline: 1px dashed color-mix(in srgb, var(--muted) 70%, transparent); outline-offset: 2px; border-radius: 2px; }
.notes-layer.drawing.text .note-text.moving { cursor: grabbing; opacity: .85; outline-style: solid; }
.lockbtn { width: auto; gap: 6px; padding: 0 10px; font-size: 13px; font-weight: 700; }
.lockbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* ---------- v3.5: archive ---------- */
.archbtn .chip { margin-left: 2px; }
.row.archrow .open { cursor: default; }
.row.archrow .acts { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tag.arch { margin-left: 8px; vertical-align: middle; font-weight: 400; }

</style>

<body>
<div id="app">
  <header class="top">
    <a class="brand" href="#songs" id="brand">GIGGARI</a>
    <nav class="tabs" aria-label="Main">
      <a href="#songs" id="tab-songs"></a>
      <a href="#setlists" id="tab-setlists"></a>
    </nav>
    <span class="spacer"></span>
    <span class="sync" id="sync" data-s="connecting"><i></i><span id="sync-text"></span></span>
    <button class="iconbtn" id="btn-settings" type="button"></button>
  </header>
  <main id="main"></main>
</div>
<div id="stage" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" hidden role="status"></div>
<div id="print" aria-hidden="true"></div>
<script>
/* GIGGARI core: ChordPro parsing, chords-over-lyrics conversion, transposing.
   Pure functions, no DOM. Runs in the browser (window.Core) and in Node (tests). */
(function (root) {
  'use strict';

  var SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  var NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  // Conventional key spellings. B is always B and the flat is Bb (never H).
  var MAJOR_KEYS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
  var MINOR_KEYS = ['Cm', 'C#m', 'Dm', 'Ebm', 'Em', 'Fm', 'F#m', 'Gm', 'G#m', 'Am', 'Bbm', 'Bm'];
  var FLAT_MAJOR = { 5: 1, 10: 1, 3: 1, 8: 1, 1: 1 };
  var FLAT_MINOR = { 2: 1, 7: 1, 0: 1, 5: 1, 10: 1, 3: 1 };

  var QUAL_RE = /^(?:maj|min|dim|aug|sus|add|omit|alt|no|M|m|\+|-|°|º|ø|Δ|[0-9]|#|b|♯|♭|\(|\)|,|\/)*$/;

  function mod12(n) { return ((n % 12) + 12) % 12; }

  function noteIndex(letter, acc) {
    var i = NOTE[letter];
    if (acc === '#' || acc === '♯') i += 1;
    if (acc === 'b' || acc === '♭') i -= 1;
    return mod12(i);
  }

  /** "F#m7/C#" -> {root:'F', acc:'#', qual:'m7', bass:'C', bassAcc:'#'}; null when not a chord. */
  function parseChord(s) {
    s = String(s == null ? '' : s).trim();
    if (!s) return null;
    var m = /^([A-G])([#b♯♭]?)(.*)$/.exec(s);
    if (!m) return null;
    var rest = m[3], bass = null, bassAcc = '';
    var bm = /\/([A-G])([#b♯♭]?)$/.exec(rest);
    if (bm) { bass = bm[1]; bassAcc = bm[2]; rest = rest.slice(0, bm.index); }
    if (!QUAL_RE.test(rest)) return null;
    return { root: m[1], acc: m[2], qual: rest, bass: bass, bassAcc: bassAcc };
  }

  function transposeChord(s, n, flat) {
    var c = parseChord(s);
    if (!c) return s;
    var tbl = flat ? FLAT : SHARP;
    var out = tbl[mod12(noteIndex(c.root, c.acc) + n)] + c.qual;
    if (c.bass) out += '/' + tbl[mod12(noteIndex(c.bass, c.bassAcc) + n)];
    return out;
  }

  /** Transpose the content of one [bracket]. Tokens that are not chords are left alone. */
  function transposeBracket(content, n, flat) {
    return String(content).split(/(\s+)/).map(function (tok) {
      return !tok || /^\s+$/.test(tok) ? tok : transposeChord(tok, n, flat);
    }).join('');
  }

  function isChordish(content) {
    var toks = String(content).trim().split(/\s+/).filter(Boolean);
    return toks.length > 0 && toks.every(function (t) { return !!parseChord(t); });
  }

  function parseKey(s) {
    var m = /^\s*([A-Ga-g])([#b♯♭]?)\s*(m|min|minor|maj|major)?\s*$/.exec(String(s == null ? '' : s));
    if (!m) return null;
    var minor = !!m[3] && /^m(in|inor)?$/.test(m[3]);
    return { idx: noteIndex(m[1].toUpperCase(), m[2]), minor: minor };
  }

  function keyName(idx, minor) { return (minor ? MINOR_KEYS : MAJOR_KEYS)[mod12(idx)]; }

  function normalizeKey(s) {
    var k = parseKey(s);
    if (!k) return '';
    // Keep the writer's own spelling of the root, only tidy the casing.
    var m = /^\s*([A-Ga-g])([#b♯♭]?)/.exec(s);
    var acc = m[2] === '♯' ? '#' : m[2] === '♭' ? 'b' : m[2];
    return m[1].toUpperCase() + acc + (k.minor ? 'm' : '');
  }

  function transposeKey(key, n) {
    var k = parseKey(key);
    if (!k) return '';
    if (mod12(n) === 0) return normalizeKey(key);
    return keyName(k.idx + n, k.minor);
  }

  function prefersFlats(idx, minor) { return !!(minor ? FLAT_MINOR : FLAT_MAJOR)[mod12(idx)]; }

  function chordsIn(body) {
    var out = [], re = /\[([^\[\]\n]*)\]/g, m;
    while ((m = re.exec(String(body || '')))) {
      m[1].trim().split(/\s+/).forEach(function (t) { if (parseChord(t)) out.push(t); });
    }
    return out;
  }

  /** Decide how to spell transposed chords. pref: 'auto' | 'sharp' | 'flat'. */
  function resolveSpelling(key, body, n, pref) {
    if (pref === 'sharp') return { keep: false, flat: false };
    if (pref === 'flat') return { keep: false, flat: true };
    if (mod12(n) === 0) return { keep: true, flat: false };
    var k = parseKey(key);
    if (k) return { keep: false, flat: prefersFlats(k.idx + n, k.minor) };
    var flats = 0, sharps = 0;
    chordsIn(body).forEach(function (c) {
      if (/^[A-G]b/.test(c)) flats++;
      if (/^[A-G]#/.test(c)) sharps++;
    });
    return { keep: false, flat: flats > sharps };
  }

  // ---------- ChordPro parsing ----------

  var SECTION_RE = /^\s*\[([^\[\]]+)\]\s*(\([^()]*\))?\s*$/;

  function parseDirective(line) {
    var m = /^\s*\{\s*([^:{}]+?)\s*(?::\s*(.*?))?\s*\}\s*$/.exec(line);
    return m ? { name: m[1].toLowerCase().replace(/\s+/g, '_'), value: m[2] || '' } : null;
  }

  function isTabLine(line) {
    var m = /^\s*(?:[A-Ga-g][#b]?)?\s*([|:\-].*)$/.exec(line);
    if (!m) return false;
    var rest = m[1];
    if (!/^[\-\d|:hpbrsxtvHPBRSXTV\/\\~^().*<>=\s]+$/.test(rest)) return false;
    return (rest.match(/-/g) || []).length >= 6;
  }

  function parseLine(raw) {
    var segs = [], re = /\[([^\[\]\n]*)\]/g, last = 0, m, cur = null;
    while ((m = re.exec(raw))) {
      var before = raw.slice(last, m.index);
      if (cur) { cur.text = before; segs.push(cur); cur = null; }
      else if (before) segs.push({ chord: null, text: before });
      var name = m[1].trim();
      cur = { chord: name || null, text: '' };
      last = re.lastIndex;
    }
    var rest = raw.slice(last);
    if (cur) { cur.text = rest; segs.push(cur); }
    else segs.push({ chord: null, text: rest });
    return segs;
  }

  /** Body text -> { meta, blocks }. Block types: line, empty, section, comment, tab. */
  function parseSong(body) {
    var meta = {}, blocks = [], inTab = false, tabBuf = null, chorus = false;
    var lines = String(body || '').replace(/\r\n?/g, '\n').split('\n');
    function flushTab() {
      if (tabBuf && tabBuf.length) blocks.push({ type: 'tab', lines: tabBuf, chorus: chorus });
      tabBuf = null;
    }
    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var d = parseDirective(raw);
      if (d) {
        var n = d.name, v = d.value;
        if (n === 'sot' || n === 'start_of_tab') { flushTab(); if (v) blocks.push({ type: 'section', text: v, chorus: chorus }); inTab = true; tabBuf = []; continue; }
        if (n === 'eot' || n === 'end_of_tab') { inTab = false; flushTab(); continue; }
        flushTab();
        if (n === 'title' || n === 't') meta.title = v;
        else if (n === 'artist' || n === 'subtitle' || n === 'st') { if (!meta.artist) meta.artist = v; }
        else if (n === 'key') meta.key = v;
        else if (n === 'tempo' || n === 'bpm') meta.bpm = v;
        else if (n === 'capo') { meta.capo = v; blocks.push({ type: 'comment', text: 'Capo ' + v, chorus: chorus }); }
        else if (n === 'comment' || n === 'c' || n === 'ci' || n === 'cb' || n === 'comment_italic' || n === 'comment_box' || n === 'highlight') blocks.push({ type: 'comment', text: v, chorus: chorus });
        else if (n === 'soc' || n === 'start_of_chorus') { chorus = true; if (v) blocks.push({ type: 'section', text: v, chorus: true }); }
        else if (n === 'eoc' || n === 'end_of_chorus') chorus = false;
        else if (/^(sov|sob|start_of_verse|start_of_bridge|start_of_part)$/.test(n)) { if (v) blocks.push({ type: 'section', text: v, chorus: chorus }); }
        continue;
      }
      if (inTab) { tabBuf.push(raw); continue; }
      if (isTabLine(raw)) { (tabBuf || (tabBuf = [])).push(raw); continue; }
      flushTab();
      if (!raw.trim()) { blocks.push({ type: 'empty', chorus: chorus }); continue; }
      var sm = SECTION_RE.exec(raw);
      if (sm && !/^\*/.test(sm[1]) && !/^N\.?C\.?$/i.test(sm[1].trim()) && !isChordish(sm[1])) {
        blocks.push({ type: 'section', text: sm[1].trim() + (sm[2] ? ' ' + sm[2] : ''), chorus: chorus });
        continue;
      }
      var lm = /^\s*([^\[\]{}:]{1,40}):\s*$/.exec(raw);

          h('span', { class: 'hint', text: t('blackHint') })),
        h('div', { class: 'field' }, h('span', { text: t('color') }), swatches),
        textSection(),
        h('div', { class: 'field' }, h('span', { text: t('inkSmooth') }),
          seg([[0, t('smooth0')], [1, t('smooth1')], [2, t('smooth2')], [3, t('smooth3')]], prefs.inkSmooth | 0, function (v) { prefs.inkSmooth = v; savePrefs(); draw(); }),
          h('span', { class: 'hint', text: t('inkSmoothHint') })),
        h('div', { class: 'field' }, h('span', { text: t('defaultSpeed') }),
          h('div', { class: 'stepper' },
            h('button', { class: 'btn', type: 'button', 'aria-label': t('slower'), text: '−', onclick: function () { step(-1); } }),
            speedB,
            h('button', { class: 'btn', type: 'button', 'aria-label': t('faster'), text: '+', onclick: function () { step(1); } })),
          h('span', { class: 'hint', text: t('defaultSpeedHint') })),
        h('div', { class: 'field' }, h('span', { text: t('tags') }), tagList,
          h('div', { class: 'newtag' }, addInput, h('button', { class: 'btn', type: 'button', onclick: addTag }, ico('plus'), t('addTag')))),
        h('div', { class: 'foot' }, h('button', { class: 'btn primary', type: 'button', text: t('done'), onclick: closeDialog }))),
        function () { if (ui.view !== 'edit') render(); });
      if (dlg.firstChild) dlg.firstChild.scrollTop = keepScroll;
    }
    draw();
  }
  $('#btn-settings').addEventListener('click', openSettings);

  // ---------- routing and start ----------
  function fromHash() {
    var want = location.hash === '#setlists' ? 'setlists' : location.hash === '#archive' ? 'archive' : 'songs';
    var cur = ui.view === 'archive' ? 'archive' : (ui.view === 'songs' || ui.view === 'edit') ? 'songs' : 'setlists';
    if (want !== cur) go(want);
  }
  window.addEventListener('hashchange', fromHash);
  $('#tab-songs').addEventListener('click', function (e) { e.preventDefault(); go('songs'); });
  $('#brand').addEventListener('click', function (e) { e.preventDefault(); go('songs'); });
  $('#tab-setlists').addEventListener('click', function (e) { e.preventDefault(); go('setlists'); });

  function start(snap) {
    applyPrefs();
    if (location.hash === '#setlists') ui.view = 'setlists';
    if (location.hash === '#archive') ui.view = 'archive';
    if (snap && snap.view === 'setlist' && snap.setlistId) { ui.view = 'setlist'; ui.setlistId = snap.setlistId; }
    ready = hasRecords();
    render();
    connect();
  }
  var hot = window.claude && window.claude.hot;
  try { if (hot && hot.snapshot) hot.snapshot(function () { return { view: ui.view, setlistId: ui.setlistId }; }); } catch (e) { /* optional */ }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
// Ask the browser not to clear the songs when the phone runs low on space.
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
